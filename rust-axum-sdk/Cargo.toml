[package]
name = "rust-axum-sdk-sample"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
axum = { version = "=0.7.9", features = ["form", "json", "query", "tokio"] }
toggly = "=0.6.3"
toggly-axum = "=0.6.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = { version = "0.18", features = ["private", "percent-encode"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.23"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
