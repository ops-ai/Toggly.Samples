[package]
name = "rust-rocket-sdk-sample"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
rocket = { version = "=0.5.1", features = ["json", "secrets"] }
toggly = "=0.4.0"
toggly-rocket = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.23"
rand = "0.8"
