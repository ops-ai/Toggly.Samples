name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: sample changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nextjs-server-sdk: ${{ steps.filter.outputs.nextjs-server-sdk }}
      javascript-sdk: ${{ steps.filter.outputs.javascript-sdk }}
      react-sdk: ${{ steps.filter.outputs.react-sdk }}
      electron-sdk: ${{ steps.filter.outputs.electron-sdk }}
      nodejs-koa-sdk: ${{ steps.filter.outputs.nodejs-koa-sdk }}
      nuxt-sdk: ${{ steps.filter.outputs.nuxt-sdk }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            nextjs-server-sdk:
              - 'nextjs-server-sdk/**'
              - '.github/workflows/ci.yml'
              - 'README.md'
              - 'docs/**'
            javascript-sdk:
              - 'javascript-sdk/**'
              - '.github/workflows/ci.yml'
              - 'README.md'
              - 'docs/**'
            react-sdk:
              - 'react-sdk/**'
              - '.github/workflows/ci.yml'
              - 'README.md'
              - 'docs/**'
            electron-sdk:
              - 'electron-sdk/**'
              - '.github/workflows/ci.yml'
              - 'README.md'
              - 'docs/**'
            nodejs-koa-sdk:
              - 'nodejs-koa-sdk/**'
              - '.github/workflows/ci.yml'
              - 'README.md'
              - 'docs/**'
            nuxt-sdk:
              - 'nuxt-sdk/**'
              - '.github/workflows/ci.yml'
              - 'README.md'
              - 'docs/**'

  nextjs-server-sdk:
    name: nextjs-server-sdk
    needs: changes
    if: needs.changes.outputs.nextjs-server-sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-server-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nextjs-server-sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOGGLY_APP_KEY: ci-placeholder
          NEXT_PUBLIC_TOGGLY_APP_KEY: ci-placeholder
          TOGGLY_ENVIRONMENT: Production

  javascript-sdk:
    name: javascript-sdk
    needs: changes
    if: needs.changes.outputs.javascript-sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: javascript-sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_TOGGLY_APP_KEY: ci-placeholder
          VITE_TOGGLY_ENVIRONMENT: Production

  react-sdk:
    name: react-sdk
    needs: changes
    if: needs.changes.outputs.react-sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_TOGGLY_APP_KEY: ci-placeholder
          VITE_TOGGLY_ENVIRONMENT: Production

  electron-sdk:
    name: electron-sdk
    needs: changes
    if: needs.changes.outputs.electron-sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron-sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
      - run: xvfb-run -a npm run test:public-host
      - run: xvfb-run -a npm run test:native-timeout
      - uses: actions/checkout@v7
        with:
          repository: ops-ai/Toggly.FeatureManagement
          ref: 80dfdfeb25e268d2b89b92e7ebf89473f25f2d83
          path: .candidate-sdk
      - run: mkdir -p "$RUNNER_TEMP/toggly-electron-sdk"
      - run: npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP/toggly-electron-sdk"
        working-directory: .candidate-sdk/Toggly.FeatureManagement.Electron
      - run: xvfb-run -a npm run test:packed-hosts
        env:
          TOGGLY_ELECTRON_SDK_TARBALL: ${{ runner.temp }}/toggly-electron-sdk/ops-ai-electron-feature-flags-toggly-1.1.0.tgz

  nodejs-koa-sdk:
    name: nodejs-koa-sdk
    needs: changes
    if: needs.changes.outputs.nodejs-koa-sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs-koa-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nodejs-koa-sdk/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TOGGLY_APP_KEY: ci-placeholder
          TOGGLY_ENVIRONMENT: Production
      - run: npm run build
        env:
          TOGGLY_APP_KEY: ci-placeholder
          TOGGLY_ENVIRONMENT: Production

  nuxt-sdk:
    name: nuxt-sdk
    needs: changes
    if: needs.changes.outputs.nuxt-sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nuxt-sdk/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TOGGLY_APP_KEY: ci-placeholder
          TOGGLY_ENVIRONMENT: Production
      - run: npm run build
        env:
          TOGGLY_APP_KEY: ci-placeholder
          TOGGLY_ENVIRONMENT: Production

  # Template for Node samples (copy when the sample folder lands):
  # <sample-id>:
  #   name: <sample-id>
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: <sample-id>
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-node@v7
  #       with:
  #         node-version: "22"
  #         cache: npm
  #         cache-dependency-path: <sample-id>/package-lock.json
  #     - run: npm ci
  #     - run: npm test
  #     - run: npm run build
  #       env:
  #         TOGGLY_APP_KEY: ci-placeholder
  #         NEXT_PUBLIC_TOGGLY_APP_KEY: ci-placeholder # Or the stack-specific public key.
  #         TOGGLY_ENVIRONMENT: Production

  sveltekit-sdk:
    name: sveltekit-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sveltekit-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sveltekit-sdk/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TOGGLY_APP_KEY: ''
          PUBLIC_TOGGLY_APP_KEY: ''
