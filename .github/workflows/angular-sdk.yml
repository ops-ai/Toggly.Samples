name: Angular sample
on:
  push:
    branches: [develop, main]
    paths: ['angular-sdk/**', '.github/workflows/angular-sdk.yml', 'README.md', 'docs/**']
  pull_request:
    branches: [develop, main]
    paths: ['angular-sdk/**', '.github/workflows/angular-sdk.yml', 'README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: angular-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  angular-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: angular-sdk/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
        env:
          TOGGLY_APP_KEY: ci-placeholder
          TOGGLY_ENVIRONMENT: Production
