name: React Router SDK sample
on:
  push:
    branches: [develop, main]
    paths: ['react-router-sdk/**', '.github/workflows/react-router-sdk.yml', 'README.md', 'docs/**']
  pull_request:
    branches: [develop, main]
    paths: ['react-router-sdk/**', '.github/workflows/react-router-sdk.yml', 'README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  react-router-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-router-sdk
    env:
      TOGGLY_APP_KEY: ci-placeholder
      VITE_TOGGLY_APP_KEY: ci-placeholder
      TOGGLY_ENVIRONMENT: Production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-router-sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
