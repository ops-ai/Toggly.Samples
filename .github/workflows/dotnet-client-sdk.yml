name: .NET client console and desktop samples
on:
  push:
    branches: [develop]
    paths: ['dotnet-client-sdk/**', '.github/workflows/dotnet-client-sdk.yml']
  pull_request:
    paths: ['dotnet-client-sdk/**', '.github/workflows/dotnet-client-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TOGGLY_APP_KEY: ''
      TOGGLY_ENVIRONMENT: Production
    defaults:
      run:
        working-directory: dotnet-client-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Console --locked-mode
      - run: dotnet restore Desktop --locked-mode
      - run: dotnet restore tests/Smoke --locked-mode
      - run: dotnet restore tests/LiveAcceptance --locked-mode
      - run: dotnet restore tests/LivePolicy --locked-mode
      - run: dotnet restore tests/PublicTelemetry/Portable --locked-mode
      - run: dotnet restore tests/PublicTelemetry/Desktop --locked-mode
      - run: dotnet build tests/PublicTelemetry/Portable -c Release --no-restore
      - run: dotnet build tests/PublicTelemetry/Desktop -c Release --no-restore
      - run: dotnet run --project tests/PublicTelemetry/Portable -f net8.0 -c Release --no-build --no-restore
      - run: dotnet run --project tests/PublicTelemetry/Portable -f net10.0 -c Release --no-build --no-restore
      - run: dotnet run --project tests/PublicTelemetry/Desktop -f net8.0 -c Release --no-build --no-restore
      - run: dotnet run --project tests/PublicTelemetry/Desktop -f net10.0 -c Release --no-build --no-restore
      - name: Verify bounded explicit retries and ambiguous nonreplay
        if: runner.os == 'Linux'
        run: dotnet run --project tests/PublicTelemetry/Portable -f net8.0 -c Release --no-build --no-restore -- --retry
      - run: dotnet build tests/LiveAcceptance -c Release --no-restore
      - run: dotnet run --project tests/LivePolicy -c Release --no-restore
      - name: Verify live runner refuses missing configuration
        run: python tests/live-guards.py dotnet tests/LiveAcceptance/bin/Release/net8.0/LiveAcceptance.dll
      - run: dotnet build Console -c Release --no-restore
      - run: dotnet build Desktop -c Release --no-restore
      - run: dotnet run --project tests/Smoke -c Release --no-restore
      - run: dotnet run --project Console -c Release --no-build -- --smoke
      - name: Verify interactive terminal cancellation
        if: runner.os != 'Windows'
        run: |
          python3 -m unittest discover -s tests -p test_console_terminal.py -v
          python3 tests/console_terminal.py
