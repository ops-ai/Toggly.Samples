name: .NET client console and desktop samples
on:
  push:
    branches: [develop]
    paths: ['dotnet-client-sdk/**', '.github/workflows/dotnet-client-sdk.yml']
  pull_request:
    paths: ['dotnet-client-sdk/**', '.github/workflows/dotnet-client-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TOGGLY_APP_KEY: ''
      TOGGLY_ENVIRONMENT: Production
    defaults:
      run:
        working-directory: dotnet-client-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Console -c Release
      - run: dotnet build Desktop -c Release
      - run: dotnet run --project tests/Smoke -c Release
      - run: dotnet run --project Console -c Release -- --smoke
