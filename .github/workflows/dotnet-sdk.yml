name: .NET SDK sample
on:
  push:
    branches: [develop]
    paths: ['dotnet-sdk/**', '.github/workflows/dotnet-sdk.yml', 'docs/SAMPLE_CONTRACT.md', 'docs/FLAG_TEMPLATE.md', 'docs/CI.md']
  pull_request:
    paths: ['dotnet-sdk/**', '.github/workflows/dotnet-sdk.yml', 'docs/SAMPLE_CONTRACT.md', 'docs/FLAG_TEMPLATE.md', 'docs/CI.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet-sdk
    env:
      TOGGLY_APP_KEY: ci-placeholder
      TOGGLY_ENVIRONMENT: Production
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet-sdk/global.json
          cache: true
          cache-dependency-path: dotnet-sdk/**/packages.lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release --no-restore
      - run: dotnet publish src/DotnetSample -c Release --no-restore -o artifacts/publish
      - name: Smoke the published app over HTTP
        run: |
          cd artifacts/publish
          ASPNETCORE_URLS=http://127.0.0.1:5000 dotnet DotnetSample.dll > /tmp/dotnet-sample.log 2>&1 &
          sample_pid=$!
          trap 'kill "$sample_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5000/ > /tmp/dotnet-home.html; then break; fi
            sleep 1
          done
          grep -q 'Offline practice' /tmp/dotnet-home.html
          curl --fail --silent 'http://127.0.0.1:5000/api/snapshot?preset=matching' > /tmp/dotnet-snapshot.json
          python3 -c 'import json; d=json.load(open("/tmp/dotnet-snapshot.json")); assert d["flags"]["ExpressCheckout"] is True; assert d["loaded"] is True'
          curl --fail --silent http://127.0.0.1:5000/site.css > /dev/null
          curl --fail --silent http://127.0.0.1:5000/api/beta
          curl --fail --silent http://127.0.0.1:5000/swagger/v1/swagger.json > /tmp/dotnet-openapi.json
          python3 -c 'import json; assert "/api/beta" in json.load(open("/tmp/dotnet-openapi.json"))["paths"]'
