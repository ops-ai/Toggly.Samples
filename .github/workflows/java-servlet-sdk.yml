name: Java Servlet SDK Sample
on:
  pull_request:
    paths:
      - 'java-servlet-sdk/**'
      - '.github/workflows/java-servlet-sdk.yml'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'docs/SAMPLE_CONTRACT.md'
      - 'docs/FLAG_TEMPLATE.md'
      - 'docs/CI.md'
  push:
    branches: [develop]
    paths:
      - 'java-servlet-sdk/**'
      - '.github/workflows/java-servlet-sdk.yml'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'docs/SAMPLE_CONTRACT.md'
      - 'docs/FLAG_TEMPLATE.md'
      - 'docs/CI.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-servlet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-servlet-sdk
    env:
      TOGGLY_APP_KEY: ''
      TOGGLY_ENVIRONMENT: Production
    steps:
      - uses: actions/checkout@v4
      # Use the official OpenJDK patch also used by the local native compatibility check.
      - name: Install OpenJDK 26.0.2.1
        run: |
          curl --fail --location --output "$RUNNER_TEMP/jdk.tar.gz" https://download.java.net/java/GA/jdk26.0.2.1/3b8e6c7ec6274148a7aa15e7e7dfb53c/1/GPL/openjdk-26.0.2.1_linux-x64_bin.tar.gz
          echo "a1489256029b389ce6ee52da0de1d01496c5df1776d6870241fe4823b998ea61  $RUNNER_TEMP/jdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$RUNNER_TEMP"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk-26.0.2.1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk-26.0.2.1/bin" >> "$GITHUB_PATH"
      - name: Install Maven 3.9.12
        run: |
          curl --fail --location --output "$RUNNER_TEMP/maven.tar.gz" https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.tar.gz
          echo "0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.12/bin" >> "$GITHUB_PATH"
      - name: Build and native HTTP tests
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify pinned dependency graph and checksums
        run: python3 scripts/check-dependencies.py
      - name: Production package smoke
        run: |
          python3 scripts/smoke.py
          java -cp 'target/test-classes:target/java-servlet-sdk.jar:target/lib/*' sample.PackagedProbe
