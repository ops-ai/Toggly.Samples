name: Java Spring WebFlux SDK Sample
on:
  pull_request:
    paths:
      - 'java-spring-webflux-sdk/**'
      - '.github/workflows/java-spring-webflux-sdk.yml'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'docs/SAMPLE_CONTRACT.md'
      - 'docs/FLAG_TEMPLATE.md'
      - 'docs/CI.md'
  push:
    branches: [develop]
    paths:
      - 'java-spring-webflux-sdk/**'
      - '.github/workflows/java-spring-webflux-sdk.yml'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'docs/SAMPLE_CONTRACT.md'
      - 'docs/FLAG_TEMPLATE.md'
      - 'docs/CI.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-spring-webflux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-spring-webflux-sdk
    env:
      TOGGLY_APP_KEY: ''
      TOGGLY_ENVIRONMENT: Production
    steps:
      - uses: actions/checkout@v7
      # Use the official OpenJDK patch also used by the local native compatibility check.
      - name: Install OpenJDK 27
        run: |
          curl --fail --location --output "$RUNNER_TEMP/jdk.tar.gz" https://download.java.net/java/GA/jdk27/55ce5470a6294008af0057ff4626d0e5/35/GPL/openjdk-27_linux-x64_bin.tar.gz
          echo "95fc37eb3a18a27a26d5904c2d89d52bace8dafa9a078ca27f4747fbc4bf070  $RUNNER_TEMP/jdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$RUNNER_TEMP"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk-27" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk-27/bin" >> "$GITHUB_PATH"
      - name: Install Maven 3.9.12
        run: |
          curl --fail --location --output "$RUNNER_TEMP/maven.tar.gz" https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.tar.gz
          echo "0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.12/bin" >> "$GITHUB_PATH"
      - name: Build and native HTTP tests
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify pinned dependency graph and checksums
        run: python3 scripts/check-dependencies.py
      - name: Production package smoke
        run: |
          python3 scripts/smoke.py
          java -cp 'target/test-classes:target/java-spring-webflux-sdk.jar:target/lib/*' sample.PackagedProbe
