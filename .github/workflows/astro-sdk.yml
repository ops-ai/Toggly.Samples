name: Astro SDK sample
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'astro-sdk/**'
      - '.github/workflows/astro-sdk.yml'
      - 'docs/SAMPLE_CONTRACT.md'
      - 'docs/FLAG_TEMPLATE.md'
      - 'README.md'
  push:
    branches: [develop, main]
    paths:
      - 'astro-sdk/**'
      - '.github/workflows/astro-sdk.yml'
      - 'docs/SAMPLE_CONTRACT.md'
      - 'docs/FLAG_TEMPLATE.md'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: astro-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  astro-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: astro-sdk/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TOGGLY_APP_KEY: ''
          TOGGLY_ENVIRONMENT: Production
      - run: npm run build
        env:
          TOGGLY_APP_KEY: ci-placeholder
          TOGGLY_ENVIRONMENT: Production
