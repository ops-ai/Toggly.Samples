name: Bug report
description: Report a problem with a sample app (setup, docs, or demo behavior)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Toggly samples. Please fill out as much as you can.
        For **SDK package** bugs, open an issue in [Toggly.FeatureManagement](https://github.com/ops-ai/Toggly.FeatureManagement/issues/new/choose) instead.
        For security issues, use [private vulnerability reporting](https://github.com/ops-ai/Toggly.Samples/security/advisories/new).
  - type: dropdown
    id: sample
    attributes:
      label: Sample
      description: Which sample is affected?
      multiple: false
      options:
        - nextjs-server-sdk
        - Other / unsure
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime / environment
      description: Node version, OS, and framework version if relevant
      placeholder: e.g. Node 22, Next.js 15.5, macOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps from a clean clone
      placeholder: |
        1. cd nextjs-server-sdk
        2. cp .env.example .env.local and set keys
        3. npm install && npm run dev
        4. Open /server/...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional — screenshots, logs, or related links
    validations:
      required: false
