version: 2

updates:
  - package-ecosystem: npm
    directory: /nuxt-sdk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /sveltekit-sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /remix-sdk
    schedule:
